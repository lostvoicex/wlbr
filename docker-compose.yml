version: "3.9"

services:
  postgres:
    image: postgres:15
    container_name: wali_bell_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: wali
      POSTGRES_PASSWORD: wali_pwd
      POSTGRES_DB: wali_bell
      TZ: Asia/Shanghai
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wali -d wali_bell"]
      interval: 5s
      timeout: 3s
      retries: 10
