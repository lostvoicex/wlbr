services:
  - type: web
    name: wlbr
    runtime: docker
    repo: https://github.com/lostvoicex/wlbr.git
    branch: main
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: "prod"
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: JWT_REFRESH_TOKEN_EXPIRE_DAYS
        value: "14"
      - key: CORS_ALLOW_ORIGINS
        value: "https://lostvoicex.github.io"
      - key: DATABASE_URL
        value: "sqlite:///./data/wali_bell.db"
    disk:
      name: data
      mountPath: /app/data
      sizeGB: 1
